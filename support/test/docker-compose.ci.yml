version: '3.7'
networks:
  main:

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: test_minio
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    hostname: minio
    volumes:
      - .dev/minio-data:/data
    networks:
     main:
       aliases:
         - minio
  hook:
    build:
      context: ../../
      dockerfile: support/test/Dockerfile.ci
    container_name: test_hook
    ports:
      - "1500:1500"
    expose:
      - "1500"
    depends_on:
     - minio
     - mongodb
     - solr
    networks:
     main:
       aliases:
         - datastream_hook
    environment:
      - NODE_ENV=integrationtest
      - PORT=1500
      - sails_redbox__apiKey=c8e844fc-8550-497f-b970-7900ec8741ca
      - sails_record__baseUrl__mint=https://demo.redboxresearchdata.com.au/mint
      - sails_datastreamCloud__companion__filePath=/opt/redbox-portal/attachments/staging
    entrypoint: /bin/bash -c "cd /opt/sails-hook-redbox-datastream-cloud/support/test; chmod +x *.sh; ./start-test.sh"
  mongodb:
    container_name: test_mongodb
    image: mvertes/alpine-mongo:latest
    networks:
      main:
        aliases:
          - mongodb
    ports:
      - "27017:27017"
    expose:
      - "27017"
  solr:
    container_name: test_solr
    image: solr:latest
    expose:
      - "8983"
    ports:
      - "8983:8983"
    networks:
      main:
       aliases:
         - solr
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox  
    
